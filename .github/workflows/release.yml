name: release

# Every push to main builds, tests, publishes the Docker image and tags a new version MAJOR.MINOR.PATCH
# (fails if any dependency is still a SNAPSHOT):
#   - MAJOR and MINOR come from .github/config.json -> version.major / version.minor (edit to bump)
#   - PATCH is the highest existing tag vMAJOR.MINOR.x + 1 (starts at 0)
#   - image ghcr.io/<owner>/github-manager:<version> and :latest, for linux/arm64 (Raspberry Pi) and linux/amd64
# Apps are not published as Maven packages, so the version history lives in git tags.
# Only this workflow builds images; dev.yml just builds and tests.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  # Manual run (Actions tab, or: gh workflow run release.yml --ref main), e.g. to retry a failed release
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # push the release tag
      packages: write     # read com.polemon:* from GitHub Packages + push the image to GHCR
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # all tags, to compute the next version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compute next version
        id: ver
        run: |
          MAJOR=$(jq -r '.version.major // empty' .github/config.json)
          MINOR=$(jq -r '.version.minor // empty' .github/config.json)
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::.github/config.json must have version.major as an integer, got '$MAJOR'"
            exit 1
          fi
          if ! [[ "$MINOR" =~ ^[0-9]+$ ]]; then
            echo "::error::.github/config.json must have version.minor as an integer, got '$MINOR'"
            exit 1
          fi

          LAST_PATCH=$(git tag -l "v$MAJOR.$MINOR.*" \
            | sed -E "s/^v$MAJOR\.$MINOR\.//" \
            | grep -E '^[0-9]+$' \
            | sort -n | tail -1 || true)

          if [ -z "$LAST_PATCH" ]; then PATCH=0; else PATCH=$((LAST_PATCH + 1)); fi
          VERSION="$MAJOR.$MINOR.$PATCH"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing github-manager $VERSION"

      - name: Require release dependencies
        run: mvn -s settings.xml -B enforcer:enforce -Drules=requireReleaseDeps -Drevision=${{ steps.ver.outputs.version }}
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Build and test
        run: mvn -s settings.xml -B verify -Drevision=${{ steps.ver.outputs.version }}
        env:
          # classic PAT with read:packages (to read the private parent); consumed by settings.xml
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        # GHCR needs a lowercase name (the owner is polemonLX)
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The Dockerfile only copies target/github-manager.jar (built above), so no QEMU emulation is needed for arm64
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Tag release
        run: |
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
