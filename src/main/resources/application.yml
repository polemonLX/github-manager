spring:
  application:
    name: github-manager

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

github-manager:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/github_manager}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sync-interval-ms: ${SYNC_INTERVAL_MS:300000}
  statsbar-refresh-interval-seconds: ${STATSBAR_REFRESH_INTERVAL_SECONDS:10}
  active-workflow-refresh-interval-seconds: ${ACTIVE_WORKFLOW_REFRESH_INTERVAL_SECONDS:10}

identity:
  issuer: ${TOKEN_ISSUER:auth}
  jwk-set-uri: ${JWK_SET_URI:http://auth:8080/.well-known/jwks.json}
  exclude-paths: /error, /css/**, /js/**, /svg/**, /favicon.svg

logging:
  level:
    com.polemon.github_manager: ${LOG_LEVEL:INFO}
