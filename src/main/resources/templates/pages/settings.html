<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:with="pageTitle='Settings'">
<body>

<div th:fragment="content">

    <div class="settings-panel">

        <h1 class="page-title">Settings</h1>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <th:block th:text="${error}"></th:block>
        </div>

        <div class="panel">
            <div class="panel-body">
                <form hx-post="/settings" hx-target="#content" hx-swap="innerHTML">
                    <div class="form-group">
                        <label for="github-token">GitHub Token</label>
                        <input type="text" id="github-token" name="github-token" class="form-control" placeholder="Enter your GitHub token">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </div>

        <div class="panel">
            <div class="panel-body">
                <p class="modal-hint" style="margin-bottom: 16px;">Reset all configuration.</p>
                <button type="button" class="btn btn-danger" id="resetConfigBtn"
                        hx-post="/settings/reset" hx-target="#content" hx-swap="innerHTML"
                        hx-confirm="Reset all configuration? This clears your GitHub token and tracked repositories.">Reset configs</button>
            </div>
        </div>

    </div>

</div>

</body>
</html>
